  <rect x="290" y="115" width="220" height="170" rx="18" fill="none" stroke="#94A3B8" stroke-opacity=".4" stroke-width="4"/>
  <path d="M345 318h110" stroke="#94A3B8" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
